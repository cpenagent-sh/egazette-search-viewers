const $ = id => document.getElementById(id);
const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.forEach(d => {
  const m = /^(\d\d)-(\w{3})-(\d{4})$/.exec(d.pub || '');
  d.ts = m ? Date.UTC(+m[3], MON[m[2]], +m[1]) : 0;
  d.year = m ? m[3] : '';
  d.blob = [d.subj, d.title, d.min, d.dep, d.off, d.gid, d.file, d.ps, d.cat, d.gnum].join(' ').toLowerCase();
  d.isMulti = /may contains multiple/i.test(d.min);
});
let view = [], sel = null, shown = 0, pdfMode = 'stored';
const PAGE = 150;

function fill(sel, vals, order) {
  const counts = {};
  vals.forEach(v => { if (v) counts[v] = (counts[v] || 0) + 1; });
  let keys = Object.keys(counts);
  keys = order ? keys.sort(order) : keys.sort((a, b) => counts[b] - counts[a]);
  keys.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = `${k} (${counts[k]})`; sel.appendChild(o); });
}
fill($('fPS'), DATA.map(d => d.ps));
fill($('fCat'), DATA.map(d => d.cat));
fill($('fYear'), DATA.map(d => d.year), (a, b) => b - a);
fill($('fMin'), DATA.map(d => d.isMulti ? '' : d.min));
$('kTotal').textContent = DATA.length.toLocaleString();
$('kWb').textContent = DATA.filter(d => d.wb).length.toLocaleString();

function apply() {
  const q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const ps = $('fPS').value, cat = $('fCat').value, yr = $('fYear').value, mn = $('fMin').value, mt = $('fMatch').value;
  view = DATA.filter(d =>
    (!ps || d.ps === ps) && (!cat || d.cat === cat) && (!yr || d.year === yr) && (!mn || d.min === mn) &&
    (!mt || (mt === 'y') === d.wb) && q.every(w => d.blob.includes(w)));
  const s = $('fSort').value;
  if (s === 'dd') view.sort((a, b) => b.ts - a.ts || a.n - b.n);
  else if (s === 'da') view.sort((a, b) => a.ts - b.ts || a.n - b.n);
  else if (s === 'min') view.sort((a, b) => a.min.localeCompare(b.min) || a.n - b.n);
  else view.sort((a, b) => a.n - b.n);
  shown = 0; $('list').innerHTML = ''; more();
  $('kShown').textContent = view.length.toLocaleString();
  $('count').textContent = `${view.length.toLocaleString()} of ${DATA.length.toLocaleString()}`;
}
function rowHtml(d) {
  const title = d.subj || d.title || '(no subject)';
  return `<div class="row${sel === d ? ' sel' : ''}" data-n="${d.n}">
    <div class="t">${esc(title)}</div>
    <div class="m"><span>${esc(d.pub)}</span><span>${esc(d.ps)}</span><span>${esc(d.isMulti ? 'Multiple ministries' : d.min)}</span>
    ${d.wb ? '' : '<span class="tag warn">not in workbench</span>'}</div></div>`;
}
function more() {
  const slice = view.slice(shown, shown + PAGE);
  $('list').insertAdjacentHTML('beforeend', slice.map(rowHtml).join(''));
  shown += slice.length;
  const old = $('more'); if (old) old.remove();
  if (shown < view.length) $('list').insertAdjacentHTML('beforeend', `<div id="more"><button id="moreBtn">Show more (${(view.length - shown).toLocaleString()} left)</button></div>`);
  if (!view.length) $('list').innerHTML = '<div style="padding:24px;color:var(--mut)">No documents match these filters.</div>';
}
$('list').addEventListener('click', e => {
  if (e.target.id === 'moreBtn') return more();
  const r = e.target.closest('.row'); if (!r) return;
  select(DATA[+r.dataset.n - 1]);
});

function field(k, v) { return v ? `<dt>${k}</dt><dd>${v}</dd>` : ''; }
function select(d) {
  sel = d;
  document.querySelectorAll('.row.sel').forEach(x => x.classList.remove('sel'));
  const el = document.querySelector(`.row[data-n="${d.n}"]`); if (el) { el.classList.add('sel'); el.scrollIntoView({block: 'nearest'}); }
  const ps = [d.part && 'Part ' + d.part, d.sec && 'Section ' + d.sec, d.sub && 'Sub-section ' + d.sub].filter(Boolean).join(', ');
  $('meta').innerHTML = `
    <h2>${esc(d.subj || d.title || '(no subject)')}</h2>
    <div>${d.wb ? '<span class="tag ok">matched in workbench</span>' : '<span class="tag warn">not in workbench &middot; eGazette link only</span>'}
      ${d.match.includes('year') ? '<span class="tag warn">matched by Gazette ID (year folder differs)</span>' : ''}</div>
    <div class="acts">
      <div class="seg"><button data-m="stored" class="${pdfMode === 'stored' ? 'on' : ''}">Stored PDF</button><button data-m="eg" class="${pdfMode === 'eg' ? 'on' : ''}">eGazette original</button></div>
      <a href="${esc(d.eg)}" target="_blank" rel="noopener">Open eGazette PDF &#8599;</a>
      ${d.stored ? `<a href="${esc(d.stored)}" target="_blank" rel="noopener">Open stored PDF &#8599;</a>` : ''}
      <button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button>
    </div>
    <dl>
      ${field('Publish date', esc(d.pub))}${field('Issued', esc(d.iss))}
      ${field('Category', esc(d.cat))}${field('Part &amp; Section', esc(d.ps) + (ps && ps.replace(/,/g,' -') ? '' : ''))}
      ${field('Ministry', esc(d.min))}${field('Department', esc(d.dep))}${field('Office', esc(d.off))}
      ${d.title && d.title !== d.subj ? field('Workbench title', esc(d.title)) : ''}
      ${field('Gazette ID', esc(d.gid))}${field('Gazette number', esc(d.gnum))}${field('Workbench id', esc(d.wbid))}
      ${field('File', esc(d.file))}${field('File size', esc(d.size))}
      ${field('Search position', `page ${esc(d.page)}, row ${esc(d.pos)}`)}
    </dl>`;
  showPdf();
}
function showPdf() {
  const d = sel, v = $('viewer');
  let url = pdfMode === 'stored' ? d.stored : d.eg;
  if (pdfMode === 'stored' && !url) {
    v.innerHTML = `<div id="nopdf"><div>No stored copy for this document (not in the workbench).</div><button class="pri" id="useEg">Try eGazette original</button></div>`;
    return;
  }
  v.innerHTML = `<iframe src="${esc(url)}#view=FitH" title="PDF"></iframe>` +
    (pdfMode === 'eg' ? '<div style="position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--mut);background:#fffd;padding:3px 8px;border-radius:5px">If blank, eGazette blocks embedding: use &ldquo;Open eGazette PDF&rdquo;</div>' : '');
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-m]'); if (m) { pdfMode = m.dataset.m; select(sel); }
  if (e.target.id === 'useEg') { pdfMode = 'eg'; select(sel); }
  if (e.target.id === 'prev') step(-1);
  if (e.target.id === 'next') step(1);
});
function step(k) {
  if (!sel) return;
  const i = view.indexOf(sel), j = i + k;
  if (j >= 0 && j < view.length) { while (j >= shown) more(); select(view[j]); }
}
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
});
['q', 'fPS', 'fCat', 'fYear', 'fMin', 'fMatch', 'fSort'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', apply));
$('reset').onclick = () => { ['q', 'fPS', 'fCat', 'fYear', 'fMin', 'fMatch'].forEach(id => $(id).value = ''); $('fSort').value = 'n'; apply(); };
$('csv').onclick = () => {
  const cols = [['n','#'],['pub','publish_date'],['iss','issued'],['cat','category'],['ps','part_section'],['min','ministry'],['dep','department'],['off','office'],['subj','subject'],['gid','gazette_id'],['gnum','gazette_number'],['wbid','workbench_id'],['size','file_size'],['eg','egazette_pdf_url'],['stored','stored_pdf_url'],['match','workbench_match']];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [cols.map(c => c[1]).join(',')].concat(view.map(d => cols.map(c => q(d[c[0]])).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = `egazette_foreign_exchange_management_filtered_${view.length}.csv`; a.click();
};
apply();
const h = parseInt(location.hash.slice(1), 10);
select(DATA[h - 1] || view[0]);
</script>
</body>
